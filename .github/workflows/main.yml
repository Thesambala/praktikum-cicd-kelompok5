name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-logic:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3 

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3 
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install 

    - name: Run Unit Tests
      run: npm test 

  build-image:
    runs-on: ubuntu-latest
    needs: test-logic 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t praktikum-cicd:latest .
        echo "Docker Image berhasil di-build dengan sukses!"